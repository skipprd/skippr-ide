name: Skippr IDE Build and Release

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

jobs:
  verify:
    name: Verify Fork Tooling
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify scaffolding and rust core
        working-directory: .
        run: |
          npm install
          npm run bootstrap:fork
          npm run verify:fork
          npm run build:rust

  package:
    name: Package ${{ matrix.target.id }}
    needs: verify
    if: matrix.target.enabled == true
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: darwin-x64
            enabled: true
            runner: macos-13
            npm_script: package:darwin:x64
            artifact_glob: artifacts/skippr-ide-darwin-x64.zip
          - id: darwin-arm64
            enabled: true
            runner: macos-14
            npm_script: package:darwin:arm64
            artifact_glob: artifacts/skippr-ide-darwin-arm64.zip
          - id: linux-x64
            enabled: true
            runner: ubuntu-24.04
            npm_script: package:linux:x64
            artifact_glob: artifacts/skippr-ide-linux-x64.tar.gz
          - id: linux-arm64
            enabled: true
            runner: ubuntu-24.04-arm
            npm_script: package:linux:arm64
            artifact_glob: artifacts/skippr-ide-linux-arm64.tar.gz
          - id: linux-armhf
            enabled: false
            runner: ubuntu-24.04
            npm_script: package:linux:armhf
            artifact_glob: artifacts/skippr-ide-linux-armhf.tar.gz
          - id: win32-x64
            enabled: true
            runner: windows-2022
            npm_script: package:win32:x64
            artifact_glob: artifacts/skippr-ide-win32-x64.zip
          - id: win32-arm64
            enabled: false
            runner: windows-11-arm
            npm_script: package:win32:arm64
            artifact_glob: artifacts/skippr-ide-win32-arm64.zip
    runs-on: ${{ matrix.target.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build target package
        working-directory: .
        run: |
          npm install
          npm run bootstrap:fork
          npm run ${{ matrix.target.npm_script }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.id }}
          path: ${{ matrix.target.artifact_glob }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.zip
            release-artifacts/**/*.tar.gz
          generate_release_notes: true
